[project]
name = "supply-chain-auditor-langgraph"
version = "0.1.0"
requires-python = ">=3.11, <3.14"
dependencies = [
    "diagrid[langgraph]>=0.4.2",
    "langchain-anthropic>=1.4",
    "langgraph>=1.2",
    "pydantic>=2",
    "httpx>=0.27",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
# auditor_core (shared, vendored identically into both tracks) and the tool
# surface are the unit-tested logic. graph/agent/app need a live Dapr sidecar
# and are exercised by node-level tests + the manual end-to-end run (see README).
source = ["auditor_core", "tools"]
