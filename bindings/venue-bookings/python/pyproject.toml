[project]
name = "venue-bookings"
version = "0.1.0"
description = "Dapr Bindings API demo: save and query venue bookings through a PostgreSQL output binding."
requires-python = ">=3.11"
dependencies = [
    "dapr==1.18.3",
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
