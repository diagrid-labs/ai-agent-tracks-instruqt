apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: shipping-orders-bulk
spec:
  pubsubname: pubsub
  topic: orders
  routes:
    default: /orders/bulk
  # bulkSubscribe makes Dapr collect messages and deliver them to the route in one request.
  # A batch is sent when it holds maxMessagesCount messages or when maxAwaitDurationMs has
  # passed since it started filling, whichever comes first.
  bulkSubscribe:
    enabled: true
    maxMessagesCount: 10
    maxAwaitDurationMs: 1000
# scopes sits beside spec, not inside it. Only the app with this app id loads the subscription.
scopes:
  - shipping
