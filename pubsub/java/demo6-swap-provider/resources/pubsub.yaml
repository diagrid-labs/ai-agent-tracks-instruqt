apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  # The same name as the Redis component in ../../resources/pubsub.yaml. The apps publish to
  # and subscribe through `pubsub`, so this is the only file that differs from Demo 5.
  name: pubsub
spec:
  type: pubsub.rabbitmq
  version: v1
  metadata:
  - name: connectionString
    value: amqp://guest:guest@localhost:5672
  # Keep exchanges and queues when the apps stop, and mark messages persistent.
  - name: durable
    value: "true"
  - name: deletedWhenUnused
    value: "false"
  - name: deliveryMode
    value: "2"
  # Dapr acknowledges a message after the app handled it. A failed message is not requeued
  # by RabbitMQ; retries come from the resiliency policy and dead-lettering from the
  # Subscription's deadLetterTopic, the same as with Redis.
  - name: autoAck
    value: "false"
  - name: requeueInFailure
    value: "false"
