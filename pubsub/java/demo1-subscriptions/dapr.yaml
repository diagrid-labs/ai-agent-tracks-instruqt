version: 1
common:
  # Two folders: the shared pubsub component and this demo's own subscription file.
  resourcesPaths:
    - ../resources
    - ./resources
apps:
  - appID: order-api
    appDirPath: ./order-api
    appPort: 5101
    daprHTTPPort: 3510
    command: ["mvn", "-q", "spring-boot:run"]
  - appID: shipping
    appDirPath: ./shipping
    appPort: 5102
    daprHTTPPort: 3511
    command: ["mvn", "-q", "spring-boot:run"]
  - appID: invoicing
    appDirPath: ./invoicing
    appPort: 5103
    daprHTTPPort: 3512
    command: ["mvn", "-q", "spring-boot:run"]
