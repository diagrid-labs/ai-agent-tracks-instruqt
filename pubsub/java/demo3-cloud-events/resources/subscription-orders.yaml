apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: shipping-orders
spec:
  # A normal subscription: Dapr delivers each message to /orders wrapped in a CloudEvent.
  pubsubname: pubsub
  topic: orders
  routes:
    default: /orders
# scopes sits beside spec, not inside it. Only the app with this app id loads the subscription.
scopes:
  - shipping
