apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: shipping-orders-routed
spec:
  pubsubname: pubsub
  topic: orders
  routes:
    # Rules are checked in order; the first CEL expression that matches picks the route.
    rules:
      - match: 'event.data.priority == "express"'
        path: /orders/express
    # Messages that match no rule go here.
    default: /orders/standard
  # When delivery keeps failing, Dapr republishes the message to this topic instead of
  # dropping it.
  deadLetterTopic: orders-dead
# scopes sits beside spec, not inside it. Only the app with this app id loads the subscription.
scopes:
  - shipping
