version: 1
common:
  # Only the shared pubsub component: a streaming subscription needs no Subscription file.
  resourcesPaths:
    - ../resources
apps:
  - appID: order-api
    appDirPath: ./OrderApi
    appPort: 5101
    daprHTTPPort: 3510
    command: ["dotnet", "run", "--urls", "http://localhost:5101"]
  - appID: warehouse
    appDirPath: ./Warehouse
    # No appPort: warehouse has no HTTP server. It opens the stream to the sidecar itself.
    daprHTTPPort: 3511
    command: ["dotnet", "run"]
