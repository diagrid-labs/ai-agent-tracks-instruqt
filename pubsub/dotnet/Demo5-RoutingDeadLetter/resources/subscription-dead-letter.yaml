apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: shipping-orders-dead
spec:
  pubsubname: pubsub
  # The dead-letter topic is an ordinary topic, so it is subscribed like any other.
  topic: orders-dead
  routes:
    default: /orders/dead
# scopes sits beside spec, not inside it. Only the app with this app id loads the subscription.
scopes:
  - shipping
