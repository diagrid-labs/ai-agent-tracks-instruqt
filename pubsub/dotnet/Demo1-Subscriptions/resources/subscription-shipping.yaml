apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: shipping-orders
spec:
  # A declarative subscription lives in YAML, outside the app. The app only needs a
  # POST route; Dapr reads this file and delivers every message on `orders` to /orders.
  pubsubname: pubsub
  topic: orders
  routes:
    default: /orders
  # Only the app with this app id loads the subscription.
  scopes:
    - shipping
