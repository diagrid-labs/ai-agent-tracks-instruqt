# Three secret stores that read the same nested secrets file. They differ only in how they
# treat the nested `orderdb` object. The secretsFile path is relative to the folder you run
# `dapr run` from, so run it from the nested-demo folder.
# secrets-nested.json is demo data for this file only (JSON cannot hold a comment). Its values
# are fake and deliberately differ from secrets.example.json, which owns the track's real demo
# secrets.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: nested-default
spec:
  type: secretstores.local.file
  version: v1
  metadata:
  - name: secretsFile
    value: ./secrets-nested.json
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: nested-flat
spec:
  type: secretstores.local.file
  version: v1
  metadata:
  - name: secretsFile
    value: ./secrets-nested.json
  # Nested keys are flattened into one name. This is the text put between the parts.
  # The default is ":".
  - name: nestedSeparator
    value: "."
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: nested-multi
spec:
  type: secretstores.local.file
  version: v1
  metadata:
  - name: secretsFile
    value: ./secrets-nested.json
  # Keep nested objects together: one secret name returns all of its fields.
  - name: multiValued
    value: "true"
