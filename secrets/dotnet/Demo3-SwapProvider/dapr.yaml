version: 1
common:
  # The only difference with Demo1-ReadSecret/dapr.yaml: this resources folder holds the
  # `secretstore` component that talks to HashiCorp Vault, not the one that reads a file.
  resourcesPath: ./resources
apps:
  - appID: order-api
    # The very same app as Demo1-ReadSecret. It is not copied, it is not changed.
    appDirPath: ../Demo1-ReadSecret
    appPort: 5001
    daprHTTPPort: 3500
    command: ["dotnet", "run", "--urls", "http://localhost:5001"]
