version: 1
common:
  # Two differences with Demo1-ReadSecret/dapr.yaml: appDirPath, which points back at that app,
  # and this resources folder, which holds the `secretstore` component that talks to HashiCorp
  # Vault, not the one that reads a file.
  resourcesPath: ./resources
apps:
  - appID: order-api
    # The very same app as Demo1-ReadSecret. It is not copied, it is not changed.
    appDirPath: ../Demo1-ReadSecret
    appPort: 5001
    daprHTTPPort: 3500
    command: ["dotnet", "run", "--urls", "http://localhost:5001"]
