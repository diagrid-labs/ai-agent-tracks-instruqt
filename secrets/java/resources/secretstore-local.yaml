apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secretstore
spec:
  type: secretstores.local.file
  version: v1
  metadata:
  # This path is relative to the working directory of the Dapr sidecar, so it assumes you
  # run `dapr run -f .` from the demo folder (for example Demo1-ReadSecret). From there,
  # ../../ is the `secrets` folder that holds secrets.json (copied from
  # secrets.example.json by the sandbox setup). Running from another folder makes the
  # sidecar fail to find the file.
  - name: secretsFile
    value: ../../secrets.json
