apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secretstore
spec:
  type: secretstores.local.file
  version: v1
  metadata:
  # The path is resolved relative to the working directory of the Dapr sidecar, which is the
  # Demo folder you run `dapr run -f .` from. Two folders up is the `secrets` folder that
  # holds secrets.json (copied from secrets.example.json by the sandbox setup).
  - name: secretsFile
    value: ../../secrets.json
