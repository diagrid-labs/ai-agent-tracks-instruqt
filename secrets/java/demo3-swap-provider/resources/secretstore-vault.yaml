apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  # Same name as the local file store in ../../resources: the app asks for `secretstore`, and
  # this file decides what stands behind that name.
  name: secretstore
spec:
  type: secretstores.hashicorp.vault
  version: v1
  metadata:
  - name: vaultAddr
    value: http://localhost:8200
  # Vault runs in dev mode in this sandbox, where the root token is simply "root". A real
  # Vault never gets a token in a file like this: use a secretKeyRef or an auth method.
  - name: vaultToken
    value: root
  # Not set here because the defaults already match how the sandbox stored the secrets:
  # vaultKVPrefix is "dapr", so the secret `orderdb-password` is read from
  # secret/dapr/orderdb-password (KV version 2).
