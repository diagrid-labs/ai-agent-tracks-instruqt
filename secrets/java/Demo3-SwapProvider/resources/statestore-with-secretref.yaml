apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
  - name: redisHost
    value: localhost:6379
  # No password in this file. Instead of `value:`, `secretKeyRef` tells the sidecar to look
  # the password up by name in a secret store when it loads this component.
  - name: redisPassword
    secretKeyRef:
      name: orderdb-password
      key: orderdb-password
# Which secret store the secretKeyRef above is resolved against: the `secretstore` component
# from secretstore-local.yaml.
auth:
  secretStore: secretstore
