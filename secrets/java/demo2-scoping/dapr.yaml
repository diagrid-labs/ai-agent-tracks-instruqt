version: 1
common:
  resourcesPath: ./resources
apps:
  - appID: app-a
    appDirPath: ./AppA
    appPort: 5002
    daprHTTPPort: 3501
    command: ["mvn", "-q", "spring-boot:run", "-Dspring-boot.run.arguments=--server.port=5002"]
  - appID: app-b
    appDirPath: ./AppB
    appPort: 5003
    daprHTTPPort: 3502
    # Scoping is off for app-b. Remove the # in front of the next line to switch it on.
    # configFilePath: ../resources/config-app-b.yaml
    command: ["mvn", "-q", "spring-boot:run", "-Dspring-boot.run.arguments=--server.port=5003"]
