version: 1
common:
  # Two differences with demo1-read-secret/dapr.yaml: appDirPath, which points back at that app,
  # and this resources folder, which holds the `secretstore` component that talks to HashiCorp
  # Vault, not the one that reads a file.
  resourcesPath: ./resources
apps:
  - appID: order-api
    # The very same app as demo1-read-secret. It is not copied, it is not changed.
    appDirPath: ../demo1-read-secret
    appPort: 5001
    daprHTTPPort: 3500
    command: ["uv", "run", "python", "app.py"]
