apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secretstore
spec:
  type: secretstores.local.file
  version: v1
  metadata:
  # This path is relative to the working directory of the Dapr sidecar. With `dapr run -f .`
  # that is the folder of each app (AppA or AppB), so ../../../ is the `secrets` folder that
  # holds secrets.json (copied from secrets.example.json by the sandbox setup).
  - name: secretsFile
    value: ../../../secrets.json
