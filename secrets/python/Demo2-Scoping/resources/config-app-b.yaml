# A Dapr Configuration resource. It is not a component: dapr.yaml hands it to the sidecar of
# one app (app-b) with `configFilePath`, so the rules below apply to app-b only.
#
# legacy-api-key is on the allow list but is not in secrets.json on purpose: it lets the track
# show "allowed but missing" next to "denied".
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: config-app-b
spec:
  secrets:
    scopes:
      - storeName: secretstore
        defaultAccess: deny
        allowedSecrets: ["payments-api-key", "legacy-api-key"]
