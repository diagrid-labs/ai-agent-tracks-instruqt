# A Dapr Configuration resource. It is not a component: dapr.yaml hands it to the sidecar of
# one app (app-b) with `configFilePath`, so the rules below apply to app-b only.
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: config-app-b
spec:
  secrets:
    scopes:
      - storeName: secretstore
        # Refuse every secret in this store...
        defaultAccess: deny
        # ...except these two. legacy-api-key is allowed but is not in secrets.json on
        # purpose: it lets the track show "allowed but missing" next to "denied".
        allowedSecrets: ["payments-api-key", "legacy-api-key"]
