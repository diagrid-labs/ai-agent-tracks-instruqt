# A Dapr Configuration resource. It is not a component: dapr.yaml hands it to the sidecar of
# one app (app-b) with `configFilePath`, so the rules below apply to app-b only.
#
# legacy-api-key is a secret this app may read that does not exist in secrets.json, on purpose:
# it lets the track tell a denial and a missing secret apart.
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: config-app-b
spec:
  secrets:
    scopes:
      - storeName: secretstore
        defaultAccess: deny
        allowedSecrets: ["payments-api-key", "legacy-api-key"]
